displayName=TRIGLAV Clan
author=Jaka
description=For the TRIGLAV OSRS clan (clan.kokalj.dev): your personal clan code links your account to the clan site, then the plugin reports skills/levels, loot and kill counts, slayer streak, achievement diary progress, collection log unlocks, pets and death value, syncs your in-game clan rank to the site, shows your team's clan bingo board as an overlay, can send your current gear setup to the site, and shows short site notifications (events, bingo, LFG) in the game chat.
warning=This plugin submits your IP address, RSN, account stats, drops, deaths, screenshots, gear and your clan's member list with ranks to a 3rd-party server (clan.kokalj.dev) not controlled or verified by RuneLite developers.
tags=triglav,clan,loot,notification,rank,bingo
